<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <!-- iOS Safari shows a native "GET" install banner for spectators on iPhone. -->
  <meta name="apple-itunes-app" content="app-id=6769837930">
  <!-- Lock down the page: scripts only from self + Apple's CloudKit CDN;
       network only to Apple CloudKit endpoints. (GitHub Pages can't set HTTP
       headers, so CSP lives here as a meta tag.) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' https://cdn.apple-cloudkit.com;
                 connect-src https://*.apple-cloudkit.com https://api.apple-cloudkit.com;
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 base-uri 'none'">
  <title>RacketTap — Live Score</title>
  <style>
    :root { color-scheme: dark; --blue:#0a84ff; --orange:#ff9f0a; --bg:#000; --card:#1c1c1e; --muted:#8e8e93; }
    /* Sport accent — driven by data-sport attribute set on #score by live.js.
       Defaults to muted so sport-keyed elements blend in if the attribute is
       absent (padel/tennis don't render sport-specific elements at all). */
    #score { --sport-accent: var(--muted); }
    #score[data-sport="badminton"]  { --sport-accent: #5ac8fa; } /* teal  */
    #score[data-sport="pickleball"] { --sport-accent: #30d158; } /* green */
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; background:var(--bg); color:#fff;
           font:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
           display:flex; flex-direction:column; align-items:center; justify-content:center;
           padding:24px; gap:18px; text-align:center; }
    .brand { position:fixed; top:20px; left:0; right:0; display:flex; align-items:center;
             justify-content:center; gap:10px; text-decoration:none; color:#fff; }
    .brand-icon { width:42px; height:42px; border-radius:9px; box-shadow:0 1px 6px rgba(0,0,0,.5); }
    .brand-name { font-size:30px; font-weight:700; letter-spacing:.01em; }
    .brand:active { opacity:.55; }
    /* state machine: body[data-state] toggles which block shows */
    #score, #message { display:none; width:100%; max-width:520px; }
    body[data-state="score"] #score { display:block; }
    body[data-state="message"] #message { display:block; }
    .pill { display:inline-block; font-size:13px; font-weight:800; letter-spacing:.1em;
            padding:5px 12px; border-radius:999px; margin-bottom:18px; }
    .pill.live { background:#30d158; color:#000; }
    .pill.stale { background:#ff9f0a; color:#000; }
    .pill.final { background:#48484a; color:#fff; }
    .col-head { display:flex; justify-content:flex-end; gap:14px; color:var(--muted);
                font-size:12px; letter-spacing:.06em; padding:0 16px 6px; }
    .col-head .sets,.col-head .games,.col-head .points,.col-head .setcell { width:44px; text-align:center; }
    .team { display:flex; align-items:center; justify-content:space-between;
            background:var(--card); border-radius:16px; padding:18px 16px; margin:8px 0;
            border-left:6px solid transparent; }
    .team-a { border-left-color:var(--blue); }
    .team-b { border-left-color:var(--orange); }
    .team.winner { outline:2px solid #30d158; }
    .team-id { display:flex; align-items:center; gap:8px; min-width:0; }
    .team-name { font-size:22px; font-weight:600; text-align:left; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
    .bcast { flex:none; font-size:11px; font-weight:700; letter-spacing:.03em; color:#30d158;
             border:1px solid #30d158; border-radius:999px; padding:2px 7px; white-space:nowrap; }
    .team-cols { display:flex; gap:14px; align-items:center; }
    .team-cols .sets,.team-cols .games { width:44px; text-align:center; font-size:24px;
                 font-variant-numeric:tabular-nums; color:var(--muted); }
    .team-cols .points { width:44px; text-align:center; font-size:30px; font-weight:800;
                 font-variant-numeric:tabular-nums; }
    /* Final set-by-set summary cells (shown only when the match is over). */
    .team-cols .setcell { width:44px; text-align:center; font-size:28px; font-weight:700;
                 font-variant-numeric:tabular-nums; color:var(--muted); }
    .team-cols .setcell.win { color:#fff; }
    .team-cols .setcell .tb { font-size:11px; font-weight:700; margin-left:1px; vertical-align:super; }
    #starpoint { margin:14px 0; padding:10px; border-radius:12px; background:#ffd60a; color:#000;
                 font-weight:800; letter-spacing:.12em; }
    #starpoint[hidden] { display:none; }
    #badges { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
    #badges[hidden] { display:none; }
    .badge { font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--muted);
             border:1px solid #48484a; border-radius:999px; padding:4px 10px; }
    /* Sport name badge uses the sport accent colour (BADMINTON=teal, PICKLEBALL=green). */
    .badge.sport { color:var(--sport-accent); border-color:var(--sport-accent); }
    /* Server-number chip (pickleball doubles): shown inline below the score grid. */
    #server-chip { display:inline-block; margin:10px 0; padding:6px 14px;
                   border-radius:999px; border:1px solid var(--sport-accent);
                   color:var(--sport-accent); font-size:13px; font-weight:700;
                   letter-spacing:.08em; }
    #server-chip[hidden] { display:none; }
    /* Side-out flash: transient cyan overlay, styled like ★ STAR POINT. */
    #sideout { margin:14px 0; padding:10px; border-radius:12px;
               background:rgba(0,212,255,.12); color:#00d4ff;
               font-weight:800; letter-spacing:.12em; border:1px solid #00d4ff; }
    #sideout[hidden] { display:none; }
    #updated { margin-top:20px; color:var(--muted); font-size:13px; }
    #msg-title { font-size:22px; font-weight:600; margin:0 0 8px; }
    #msg-detail { color:var(--muted); font-size:15px; margin:0; max-width:32ch; display:inline-block; }
    .foot { position:fixed; bottom:20px; left:0; right:0; color:var(--muted); font-size:15px;
            display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; padding:0 16px; }
    .foot a { color:var(--blue); text-decoration:none; font-weight:600; }
    .foot a:active { opacity:.55; }
    .foot .dot { opacity:.5; }
    .foot .cta { display:inline-flex; align-items:center; background:var(--blue); color:#fff;
                 padding:10px 18px; border-radius:999px; font-weight:700; font-size:15px; }
    .foot .cta:active { opacity:.7; }
    /* Short / landscape viewports: the vertically-centered score otherwise
       slides under the position:fixed brand header (and the footer), so the
       LIVE pill collides with the logo. Drop the brand + footer into normal
       flow and shrink the brand so everything stacks without overlapping.
       The page scrolls if the content is taller than the viewport. */
    @media (max-height: 560px) {
      body { justify-content:flex-start; padding:12px 16px; gap:10px; }
      .brand { position:static; }
      .brand-icon { width:30px; height:30px; }
      .brand-name { font-size:22px; }
      .foot { position:static; margin-top:10px; }
    }
  </style>
</head>
<body data-state="message">
  <a class="brand" href="../" target="_blank" rel="noopener" aria-label="RacketTap home">
    <img class="brand-icon" src="../icon.png" alt="">
    <span class="brand-name">RacketTap</span>
  </a>

  <main id="score">
    <span id="status-pill" class="pill live">LIVE</span>
    <div id="col-head" class="col-head"></div>
    <div id="teams"></div>
    <div id="starpoint" hidden>★ STAR POINT</div>
    <div id="server-chip" hidden></div>
    <div id="sideout" hidden>SIDE OUT</div>
    <div id="badges" hidden></div>
    <div id="updated"></div>
  </main>

  <section id="message">
    <h1 id="msg-title">Loading…</h1>
    <p id="msg-detail"></p>
  </section>

  <div class="foot">
    <span>Scored live with RacketTap.</span>
    <a class="cta" href="https://apps.apple.com/app/id6769837930" target="_blank" rel="noopener">Get the app — free</a>
  </div>

  <!-- Apple CloudKit JS. NOTE: add Subresource Integrity (integrity="sha384-…")
       once you've fetched the hash for this exact file; omitted now to avoid a
       wrong hash blocking the load. -->
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script src="live.js"></script>
</body>
</html>
