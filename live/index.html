<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <!-- iOS Safari shows a native "GET" install banner for spectators on iPhone. -->
  <meta name="apple-itunes-app" content="app-id=6769837930">
  <!-- Lock down the page: scripts only from self + Apple's CloudKit CDN;
       network only to Apple CloudKit endpoints. (GitHub Pages can't set HTTP
       headers, so CSP lives here as a meta tag.) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' https://cdn.apple-cloudkit.com;
                 connect-src https://*.apple-cloudkit.com https://api.apple-cloudkit.com;
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 base-uri 'none';
                 form-action 'none'">
  <title>RacketTap — Live Score</title>
  <style>
    :root { color-scheme: dark; --blue:#0a84ff; --orange:#ff9f0a; --bg:#000; --card:#1c1c1e;
            --muted:#98989f; --green:#30d158;
            --pts: clamp(64px, min(34vw, 14.5dvh), 260px);
            --pad: clamp(12px, 3vw, 28px); }
    /* Sport accent — driven by data-sport attribute set on #score by live.js.
       Defaults to muted so sport-keyed elements blend in if the attribute is
       absent (padel/tennis don't render sport-specific elements at all). */
    #score { --sport-accent: var(--muted); }
    #score[data-sport="badminton"]  { --sport-accent: #5ac8fa; } /* teal  */
    #score[data-sport="pickleball"] { --sport-accent: #30d158; } /* green */
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:#fff;
           font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                       "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
           display:flex; flex-direction:column; align-items:center; text-align:center;
           padding:max(14px, env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
                   max(14px, env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
           gap:clamp(8px, 2dvh, 18px); }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px;
             text-decoration:none; color:#fff; flex:none; }
    .brand-icon { width:clamp(28px, 5dvh, 42px); height:clamp(28px, 5dvh, 42px); border-radius:9px;
                  box-shadow:0 1px 6px rgba(0,0,0,.5); }
    .brand-name { font-size:clamp(20px, 3.4dvh, 30px); font-weight:700; letter-spacing:.01em; }
    .brand:active { opacity:.55; }
    /* state machine: body[data-state] toggles which block shows */
    main#score, #message { display:none; width:100%; }
    body[data-state="score"] #score { display:flex; flex:1; flex-direction:column; justify-content:center;
                                      align-items:center; gap:clamp(8px, 1.8dvh, 16px); min-height:0; }
    body[data-state="message"] #message { display:flex; flex:1; flex-direction:column;
                                          align-items:center; justify-content:center; }
    #teams { width:100%; max-width:1600px; display:grid; grid-template-columns:minmax(0,1fr);
             gap:clamp(8px, 2vw, 24px); }
    .pill { display:inline-block; font-size:clamp(12px, 2.2dvh, 28px); font-weight:800; letter-spacing:.1em;
            padding:5px 14px; border-radius:999px; }
    .pill.live { background:var(--green); color:#000; }
    .pill.stale { background:var(--orange); color:#000; }
    .pill.final { background:#48484a; color:#fff; }

    /* Score cards — portrait: stacked, point number left + stats right. */
    .team { --tc:var(--blue); --tcbg:rgba(10,132,255,.16); min-width:0;
            background:linear-gradient(160deg, var(--tcbg), #111113 75%);
            border:1px solid rgba(255,255,255,.06); border-top:5px solid var(--tc);
            border-radius:clamp(18px, 3vw, 32px); padding:clamp(12px, 2.4vw, 28px);
            display:flex; flex-direction:column; gap:clamp(4px, 1.2dvh, 12px); text-align:left; }
    .team-b { --tc:var(--orange); --tcbg:rgba(255,159,10,.16); }
    .team.winner { box-shadow:0 0 0 3px var(--green); }
    .team-id { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; min-width:0; }
    .team-name { font-size:clamp(18px, min(3.2vw, 4.2dvh), 40px); font-weight:700; line-height:1.15;
                 overflow-wrap:anywhere; min-width:0; max-width:100%;
                 display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
    .team-name.long { font-size:clamp(14px, min(2.4vw, 3.2dvh), 28px); }
    .bcast { flex:none; font-size:clamp(11px, 1.9dvh, 14px); font-weight:700; letter-spacing:.03em;
             color:var(--green); border:1px solid var(--green); border-radius:999px;
             padding:2px 8px; white-space:nowrap; }
    .team-cols { display:flex; align-items:center; justify-content:space-between; gap:clamp(8px, 2vw, 24px);
                 min-width:0; }
    .points { font-size:var(--pts); line-height:1; font-weight:800; letter-spacing:-.02em;
              font-variant-numeric:tabular-nums; color:var(--tc); display:inline-block; }
    .points.bump { animation:bump .45s cubic-bezier(.2,.9,.3,1.4); }
    @keyframes bump { 0% { transform:scale(.82); opacity:.35; } 100% { transform:scale(1); opacity:1; } }
    .stats { display:flex; gap:clamp(12px, 3vw, 32px); }
    .stat { display:flex; flex-direction:column; align-items:center; min-width:2ch; }
    .stat b { font-size:clamp(26px, min(7vw, 7dvh), 72px); line-height:1.05; font-weight:700;
              font-variant-numeric:tabular-nums; color:#fff; }
    .stat i, .setcell i { font-style:normal; font-size:clamp(10px, 1.9dvh, 14px); font-weight:700;
                          letter-spacing:.08em; color:var(--muted); }
    /* Final set-by-set summary cells (shown only when the match is over). */
    .team-cols.final { justify-content:space-around; gap:clamp(4px, 1.5vw, 16px); }
    .setcell { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; }
    .setcell b { font-size:clamp(34px, min(9vw, 10dvh), 120px); line-height:1.05; font-weight:700;
                 font-variant-numeric:tabular-nums; color:var(--muted); }
    .setcell.win b { color:#fff; }
    .setcell .tb { font-size:.32em; font-weight:700; margin-left:1px; vertical-align:super; line-height:0; }
    /* A set frozen by the deciding tie-break: kept as played, never won. */
    .setcell.unfinished b { opacity:.45; }

    /* Banners */
    .banner { width:100%; max-width:1600px; padding:10px 14px; border-radius:14px; font-weight:800;
              letter-spacing:.12em; font-size:clamp(14px, 2.6dvh, 22px); overflow-wrap:anywhere; }
    #starpoint { background:#ffd60a; color:#000; }
    /* Deciding tie-break banner: same capsule idiom as ★ STAR POINT, in red. */
    #deciding { background:#ff453a; color:#fff; }
    .status-row { position:relative; display:flex; justify-content:center; align-items:center;
                  margin-bottom:clamp(2px, 1dvh, 8px); }
    #sideout { position:absolute; inset:0; margin:auto; width:max-content; max-width:none; left:50%; right:auto; transform:translateX(-50%); min-height:100%;
               display:flex; align-items:center; justify-content:center; padding:0 16px;
               border-radius:999px; background:#04323c; color:#00d4ff; border:1px solid #00d4ff;
               font-weight:800; letter-spacing:.12em; font-size:clamp(12px, 2.2dvh, 36px); white-space:nowrap; }
    .pts-wrap { display:inline-flex; flex-direction:column; align-items:center; }
    .pts-cap { font-style:normal; font-size:clamp(10px, 1.9dvh, 14px); font-weight:700;
               letter-spacing:.1em; color:var(--muted); }
    [hidden] { display:none !important; }
    #decided-note { color:var(--muted); font-size:clamp(13px, 2.2dvh, 18px); }
    #badges { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .badge { font-size:clamp(12px, 2dvh, 15px); font-weight:700; letter-spacing:.08em; color:var(--muted);
             border:1px solid #48484a; border-radius:999px; padding:4px 12px; }
    /* Sport name badge uses the sport accent colour (BADMINTON=teal, PICKLEBALL=green). */
    .badge.sport { color:var(--sport-accent); border-color:var(--sport-accent); }
    /* Server-number chip (pickleball doubles). */
    #server-chip { display:inline-block; padding:6px 16px; border-radius:999px;
                   border:1px solid var(--sport-accent); color:var(--sport-accent);
                   font-size:clamp(13px, 2.4dvh, 20px); font-weight:700; letter-spacing:.08em;
                   transition:background .3s, color .3s; }
    #server-chip.server-handoff { background:var(--sport-accent); color:#000; }
    #updated { color:var(--muted); font-size:clamp(13px, 2.1dvh, 17px); }
    #msg-title { font-size:clamp(24px, 4dvh, 40px); font-weight:700; margin:0 0 8px; }
    #msg-detail { color:var(--muted); font-size:clamp(15px, 2.4dvh, 20px); margin:0; max-width:32ch; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);
               white-space:nowrap; }
    .foot { flex:none; color:var(--muted); font-size:clamp(14px, 2.2dvh, 17px);
            display:flex; gap:8px 12px; justify-content:center; align-items:center; flex-wrap:wrap; }
    .foot a { color:var(--blue); text-decoration:none; font-weight:600; }
    .foot a:active { opacity:.55; }
    .foot .cta { display:inline-flex; align-items:center; background:var(--blue); color:#fff;
                 padding:10px 18px; border-radius:999px; font-weight:700; }
    .foot .cta:active { opacity:.7; }

    /* Wide / landscape: Team A left, Team B right; point number centred and huge. */
    @media (min-width:700px) and (orientation:landscape), (min-width:1100px) {
      :root { --pts: clamp(72px, min(21vw, 36dvh), 440px); }
      #teams { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:auto 1fr; }
      /* Both cards share rows so names / numbers / stats line up across cards. */
      .team { align-items:stretch; display:grid; grid-row:span 2; grid-template-rows:subgrid; }
      .team-cols { flex-direction:column; justify-content:center; gap:clamp(4px, 1.5dvh, 20px); }
      .team-cols.final { flex-direction:row; justify-content:space-around; }
      .points { text-align:center; }
      .stats { justify-content:center; }
      .team-id { justify-content:flex-start; align-self:start; align-content:flex-start; }
      .stat b { font-size:clamp(26px, min(4.2vw, 7dvh), 80px); }
    }
    /* Short viewports (phone landscape): tighten chrome so all fits one screen. */
    @media (max-height:560px) {
      :root { --pts: clamp(48px, min(17vw, 24dvh), 200px); }
      body { padding-top:max(8px, env(safe-area-inset-top)); padding-bottom:max(8px, env(safe-area-inset-bottom)); gap:6px; }
      .team { padding:8px 14px; gap:2px; }
      .team-name { font-size:16px; }
      .team-name.long { font-size:13px; }
      body[data-state="score"] #score { gap:5px; }
      .team-cols { gap:0 !important; }
      .team-cols:has(.pts-wrap) { gap:8px !important; }
      .pts-cap { margin-top:2px; }
      .team-cols:has(.pts-wrap) { gap:10px !important; }
      .team-cols:has(.pts-wrap) .stats { border-top:1px solid rgba(255,255,255,.18); padding-top:3px; width:60%; justify-content:center; }
      #server-chip { padding:2px 12px; font-size:12px; }
      .badge { padding:1px 10px; }
      #updated { font-size:12px; }
      .foot { gap:4px 10px; }
      .stat b { font-size:24px; }
      .setcell b { font-size:clamp(30px, 14dvh, 72px); }
      .brand-icon { width:24px; height:24px; }
      .brand-name { font-size:18px; }
      .pill { padding:2px 10px; }
      .status-row { margin-bottom:4px; }
      .banner { padding:4px 10px; }
      .foot { font-size:13px; } .foot .cta { padding:6px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation:none !important; transition:none !important; }
    }
  </style>
</head>
<body data-state="message">
  <a class="brand" href="../" target="_blank" rel="noopener" aria-label="RacketTap home">
    <img class="brand-icon" src="../icon.png" alt="">
    <span class="brand-name">RacketTap</span>
  </a>

  <main id="score">
    <div class="status-row">
      <span id="status-pill" class="pill live">LIVE</span>
      <!-- Overlays the status pill for ~2 s (takes no layout space). -->
      <div id="sideout" hidden>SIDE OUT</div>
    </div>
    <div id="teams"></div>
    <div id="starpoint" class="banner" hidden>★ STAR POINT</div>
    <div id="deciding" class="banner" hidden></div>
    <div id="decided-note" hidden>Decided by tie-break</div>
    <div id="server-chip" hidden></div>
    <div id="badges" hidden></div>
    <div id="updated"></div>
    <div id="sr-score" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>

  <section id="message">
    <h1 id="msg-title">Loading…</h1>
    <p id="msg-detail"></p>
  </section>

  <div class="foot">
    <span>Scored live with RacketTap.</span>
    <a class="cta" href="https://apps.apple.com/app/id6769837930" target="_blank" rel="noopener">Get the app — free</a>
  </div>

  <!-- Apple CloudKit JS. NOTE: add Subresource Integrity (integrity="sha384-…")
       once you've fetched the hash for this exact file; omitted now to avoid a
       wrong hash blocking the load. -->
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script src="live.js"></script>
</body>
</html>
